<section class="hero" id="vrh" aria-labelledby="hero-naslov">
  <div class="okvir">
    <div class="hero-mreza">
      <div>
        <h1 id="hero-naslov">{{hero.naslov}}</h1>
        <p class="vodeci">{{hero.tekst}}</p>
        <div class="radnje">
          <a class="dugme dugme-glavno" href="preuzimanje.html">{{cta.glavno}}</a>
          <a class="veza" href="#kako-radi"><span>{{hero.saznaj}}</span> <span class="strelica" aria-hidden="true">›</span></a>
        </div>
        <p class="sitno">{{hero.sitno}}</p>
      </div>
      <div class="hero-topi">
        <img src="{{sistem.koren}}slike/web/topi-meri-korpus-isecen-800.webp" srcset="{{sistem.koren}}slike/web/topi-meri-korpus-isecen-800.webp 800w, {{sistem.koren}}slike/web/topi-meri-korpus-isecen-1600.webp 1064w" sizes="(max-width: 860px) 260px, 440px" width="1064" height="1068" alt="{{hero.topi_alt}}" fetchpriority="high">
      </div>
    </div>
    <div class="hero-prozor" id="hero-prozor">
      <div class="prozor">
        <div class="prozor-traka" aria-hidden="true"><i></i><i></i><i></i></div>
        <img src="{{sistem.koren}}slike/web/snimak-41-kuhinja-sonoma-bela-laminat-800.webp" srcset="{{sistem.koren}}slike/web/snimak-41-kuhinja-sonoma-bela-laminat-800.webp 800w, {{sistem.koren}}slike/web/snimak-41-kuhinja-sonoma-bela-laminat-1600.webp 1366w" sizes="(max-width: 1168px) 100vw, 1120px" width="1366" height="768" alt="{{hero.prozor_alt}}">
      </div>
    </div>
  </div>
</section>
