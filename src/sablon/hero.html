<section class="hero" id="vrh" aria-labelledby="hero-naslov">
  <div class="hero-slika">
    <img src="{{sistem.koren}}slike/web/vrh-topi-laptop-1600.webp" srcset="{{sistem.koren}}slike/web/vrh-topi-laptop-800.webp 800w, {{sistem.koren}}slike/web/vrh-topi-laptop-1600.webp 1600w" sizes="(max-width: 980px) 100vw, 64vw" width="1894" height="688" alt="{{hero.slika_alt}}" fetchpriority="high">
  </div>
  <div class="okvir hero-unutra">
    <div class="hero-tekst">
      <p class="nadnaslov">{{hero.nadnaslov}}</p>
      <h1 id="hero-naslov">{{hero.n1}}<br> {{hero.n2}} <em>{{hero.n3}}</em></h1>
      <p class="hero-vodeci">{{hero.tekst}}</p>
      <ul class="hero-prednosti">
        <li>{{hero.p1}}</li>
        <li>{{hero.p2}}</li>
        <li>{{hero.p3}}</li>
        <li>{{hero.p4}}</li>
      </ul>
      <div class="hero-dugmad">
        <a class="dugme dugme-glavno" href="preuzimanje.html">{{cta.glavno}} <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-7-7 7 7-7 7"/></svg></a>
        <a class="dugme dugme-tamno" href="#kako-radi">{{hero.saznaj}}</a>
      </div>
      <p class="hero-sitno">{{hero.sitno}}</p>
    </div>
  </div>
</section>
