<section class="hero tamno" id="vrh" aria-labelledby="hero-naslov">
  <div class="okvir hero-mreza">
    <div class="hero-tekst">
      <p class="nadnaslov">{{hero.nadnaslov}}</p>
      <h1 id="hero-naslov">{{hero.n1}} {{hero.n2}} <span class="naglasak">{{hero.n3}}</span></h1>
      <p class="vodeci">{{hero.tekst}}</p>
      <ul class="stikle">
        <li>{{hero.p1}}</li>
        <li>{{hero.p2}}</li>
        <li>{{hero.p3}}</li>
        <li>{{hero.p4}}</li>
      </ul>
      <div class="radnje">
        <a class="dugme dugme-glavno" href="preuzimanje.html">{{cta.glavno}}</a>
        <a class="dugme dugme-belo" href="#konfigurator">{{hero.saznaj}}</a>
      </div>
      <p class="sitno hero-sitno"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>{{hero.sitno}}</p>
    </div>
    <div class="hero-slika">
      <div class="laptop">
        <div class="laptop-ekran">
          <img src="{{sistem.koren}}slike/web/snimak-41-kuhinja-sonoma-bela-laminat-800.webp" srcset="{{sistem.koren}}slike/web/snimak-41-kuhinja-sonoma-bela-laminat-800.webp 800w, {{sistem.koren}}slike/web/snimak-41-kuhinja-sonoma-bela-laminat-1600.webp 1366w" sizes="(max-width: 860px) 92vw, 620px" width="1366" height="768" alt="{{hero.prozor_alt}}" fetchpriority="high">
        </div>
        <div class="laptop-osnova" aria-hidden="true"></div>
      </div>
      <img class="hero-topi" src="{{sistem.koren}}slike/web/topi-meri-korpus-isecen-400.webp" srcset="{{sistem.koren}}slike/web/topi-meri-korpus-isecen-400.webp 400w, {{sistem.koren}}slike/web/topi-meri-korpus-isecen-800.webp 800w" sizes="(max-width: 860px) 130px, 270px" width="1064" height="1068" alt="{{hero.topi_alt}}">
    </div>
  </div>
</section>
