<!doctype html>
<html lang="{{kod}}">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("../../../fontovi/inter-latin-wght-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("../../../fontovi/inter-latin-ext-wght-normal.woff2") format("woff2"); unicode-range: U+0100-02AF, U+1E00-1EFF; }
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("../../../fontovi/inter-cyrillic-wght-normal.woff2") format("woff2"); unicode-range: U+0400-045F, U+0490-0491; }
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("../../../fontovi/inter-greek-wght-normal.woff2") format("woff2"); unicode-range: U+0370-03FF; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Inter", system-ui, sans-serif; background: radial-gradient(70% 90% at 78% 45%, rgba(240, 176, 64, .22) 0, rgba(240, 176, 64, .05) 55%, #0d0e10 100%), #0d0e10; color: #ffffff; position: relative; }
  .tekst { position: absolute; left: 72px; top: 0; bottom: 0; width: 540px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .logo { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 28px; letter-spacing: -.02em; }
  .logo i { width: 36px; height: 36px; border-radius: 9px; background: #f0b040; display: inline-block; }
  h1 { margin: 0; font-weight: 800; font-size: {{velicina}}px; line-height: 1.04; letter-spacing: -.035em; }
  p { margin: 0; font-weight: 500; font-size: 26px; line-height: 1.4; color: #c9c4bb; }
  .dugme { display: inline-block; align-self: flex-start; margin-top: 8px; background: #00d858; color: #04220f; font-weight: 800; font-size: 24px; padding: 16px 30px; border-radius: 999px; }
  .topi { position: absolute; right: 36px; top: 40px; width: 520px; height: 560px; object-fit: contain; }
</style>
</head>
<body>
  <div class="tekst">
    <div class="logo"><i></i>TOPICA</div>
    <h1>{{naslov}}</h1>
    <p>{{opis}}</p>
    <span class="dugme">{{dugme}}</span>
  </div>
  <img class="topi" src="../../../slike/izvor/topi-meri-korpus-isecen.png" alt="">
</body>
</html>
