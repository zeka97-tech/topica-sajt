<header class="traka{{sistem.trakaKlasa}}" id="traka">
  <div class="okvir">
    <a class="logo" href="{{sistem.pocetna}}" aria-label="{{a11y.logo}}"><span class="logo-znak" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M8 2.5v11M2.5 8h11"/></svg></span>TOPICA</a>
    <nav aria-label="{{a11y.navigacija}}">
      <ul class="traka-stavke" id="traka-stavke">
        <li><a href="{{sistem.pocetna}}#kako-radi">{{nav.kako}}</a></li>
        <li><a href="{{sistem.pocetna}}#mogucnosti">{{nav.mogucnosti}}</a></li>
        <li><a href="{{sistem.pocetna}}#galerija">{{nav.galerija}}</a></li>
        <li><a href="{{sistem.pocetna}}#cena">{{nav.cena}}</a></li>
        <li><a href="{{sistem.pocetna}}#pitanja">{{nav.pitanja}}</a></li>
        <li><a href="{{sistem.pocetna}}blog/">{{nav.blog}}</a></li>
      </ul>
    </nav>
    <div class="traka-desno">
      <details class="jezik" id="jezik">
        <summary aria-label="{{a11y.jezik}}">{{sistem.kod}} <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></summary>
        <ul class="jezik-lista">{{sistem.jezikLista}}</ul>
      </details>
      <a class="dugme dugme-glavno dugme-malo traka-cta" href="{{sistem.pocetna}}preuzimanje.html">{{cta.kratko}}</a>
      <button class="meni-dugme" type="button" aria-expanded="false" aria-controls="traka-stavke" aria-label="{{a11y.meni}}"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>
