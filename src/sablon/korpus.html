<section class="korpus" id="korpus" aria-labelledby="korpus-naslov">
  <div class="korpus-visina" id="korpus-visina">
    <div class="korpus-lepljivo">
      <div class="okvir korpus-naslov"><h2 id="korpus-naslov">{{korpus.naslov}}</h2></div>
      <div class="korpus-scena-okvir">
        <div class="korpus-scena" id="korpus-scena" aria-hidden="true">
          <div class="ploca-podloga" id="ploca-podloga"></div>
          <div class="kamera"><div class="svet" id="svet"></div></div>
          <div class="krojna-lista" id="krojna-lista">
            <div class="prozor">
              <div class="prozor-traka"><i></i><i></i><i></i></div>
              <img src="{{sistem.koren}}slike/web/isecak-po-meri-tabela-800.webp" srcset="{{sistem.koren}}slike/web/isecak-po-meri-tabela-800.webp 800w, {{sistem.koren}}slike/web/isecak-po-meri-tabela-1600.webp 1018w" sizes="640px" width="1018" height="440" loading="lazy" alt="">
            </div>
          </div>
        </div>
        <noscript><div class="okvir"><div class="prozor"><img src="{{sistem.koren}}slike/web/snimak-33-po-meri-800.webp" width="1366" height="768" alt="{{korpus.noscript_alt}}"></div></div></noscript>
        <ul class="vizuelno-skriveno" id="nazivi-dasaka">
          <li data-daska="bok">{{korpus.daska.bok}}</li>
          <li data-daska="dno">{{korpus.daska.dno}}</li>
          <li data-daska="polica">{{korpus.daska.polica}}</li>
          <li data-daska="precka">{{korpus.daska.precka}}</li>
          <li data-daska="front">{{korpus.daska.front}}</li>
          <li data-daska="ledja">{{korpus.daska.ledja}}</li>
        </ul>
      </div>
      <div class="okvir korpus-natpisi" id="korpus-natpisi" aria-live="polite">
        <p class="natpis">{{korpus.natpis.1}}</p>
        <p class="natpis">{{korpus.natpis.2}}</p>
        <p class="natpis">{{korpus.natpis.3}}</p>
        <p class="natpis">{{korpus.natpis.4}}</p>
      </div>
    </div>
  </div>
  <div class="okvir korpus-posle">
    <p class="vodeci">{{korpus.posle}}</p>
    <div class="radnje"><a class="dugme dugme-glavno" href="preuzimanje.html">{{cta.glavno}}</a></div>
  </div>
</section>
