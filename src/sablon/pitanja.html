<section class="odeljak" id="pitanja" aria-labelledby="pitanja-naslov">

    <div class="centrirano">
      <span class="nadnaslov">{{pitanja.nadnaslov}}</span>
      <h2 id="pitanja-naslov" class="naslov-odeljka">{{pitanja.naslov}}</h2>
    </div>
    <div class="pitanja-lista">
      <details class="pitanje"><summary>{{pitanja.1.p}}</summary><p>{{pitanja.1.o}}</p></details>
      <details class="pitanje"><summary>{{pitanja.2.p}}</summary><p>{{pitanja.2.o}}</p></details>
      <details class="pitanje"><summary>{{pitanja.3.p}}</summary><p>{{pitanja.3.o}}</p></details>
      <details class="pitanje"><summary>{{pitanja.4.p}}</summary><p>{{pitanja.4.o}}</p></details>
      <details class="pitanje"><summary>{{pitanja.5.p}}</summary><p>{{pitanja.5.o}}</p></details>
      <details class="pitanje"><summary>{{pitanja.6.p}}</summary><p>{{pitanja.6.o}}</p></details>
    </div>
  </div>
</section>
