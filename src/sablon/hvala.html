<section class="podstrana" aria-labelledby="hvala-naslov">
  <div class="okvir">
    <div class="clanak">
      <span class="nadnaslov">{{hvala.nadnaslov}}</span>
      <h1 id="hvala-naslov">{{hvala.naslov}}</h1>
      <p class="vodeci">{{hvala.tekst}} <a href="{{sajt.preuzimanjeExe}}" id="hvala-direktno">{{preuzimanje.direktno}}</a></p>
      <h2>{{hvala.koraci_naslov}}</h2>
      <div class="koraci-instalacije">
        <div class="korak-instalacije"><span class="korak-broj" aria-hidden="true">1</span><p>{{hvala.k1}}</p></div>
        <div class="korak-instalacije"><span class="korak-broj" aria-hidden="true">2</span><p>{{hvala.k2}}</p></div>
        <div class="korak-instalacije"><span class="korak-broj" aria-hidden="true">3</span><p>{{hvala.k3}}</p></div>
      </div>
      <div class="clanak-poziv"><p>{{hvala.snimak}}</p><a class="veza" href="{{sajt.youtubeLink}}"><span>{{hvala.snimak_dugme}}</span> <span class="strelica" aria-hidden="true">›</span></a></div>
    </div>
  </div>
</section>
