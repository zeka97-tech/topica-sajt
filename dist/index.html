<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPICA</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="1; url=en/">
<script>
(function () {
  var kodovi = ["sr","en","hr","de","sl","hu","pl","ru","cs","sk","it","es","fr","ro","bg","nl","pt","el","sv","da","no","fi","uk"], podrazumevani = "sr", xDefault = "{{xDefault}}";
  var izabran = null;
  try { izabran = localStorage.getItem("topica-jezik"); } catch (e) {}
  if (!izabran || kodovi.indexOf(izabran) < 0) {
    var jezici = navigator.languages || [navigator.language || ""];
    for (var i = 0; i < jezici.length && !izabran; i++) {
      var k = jezici[i].toLowerCase().split("-")[0];
      if (k === "nb" || k === "nn") k = "no";
      if (k === "bs" || k === "me") k = "sr";
      if (kodovi.indexOf(k) >= 0) izabran = k;
    }
  }
  location.replace((izabran || xDefault) + "/" + location.hash);
})();
</script>
</head>
<body><p><a href="{{xDefault}}/">TOPICA</a></p></body>
</html>
